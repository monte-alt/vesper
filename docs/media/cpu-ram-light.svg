  <text x="586" y="170" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#334155">Queue Submit Thread (vesper-submit)</text>
  <rect x="586" y="178" width="240" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="586" y="191" width="125" height="10" rx="3" fill="#9333ea"/>
