  <text x="586" y="226" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#334155">Upload Staging Workers (vesper-land)</text>
  <rect x="586" y="234" width="225" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="586" y="247" width="107" height="10" rx="3" fill="#ea580c"/>
