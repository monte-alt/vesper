<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-label="Vesper RAM and CPU Overhead Reduction Charts">
  <rect width="1100" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="24" y="24" width="510" height="292" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="54" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Peak Private RAM Footprint (-32%)</text>
  <text x="44" y="74" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" fill="#475569">Windows Commit Charge · Fits comfortably inside 32 GB host RAM</text>

  <text x="44" y="114" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#334155">Stock Baseline (4K)</text>
  <rect x="44" y="122" width="380" height="20" rx="4" fill="#f87171"/>
  <text x="434" y="137" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">36.2 GB (paged)</text>

  <text x="44" y="168" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#334155">Phase 4 Tuned (1440p FSR)</text>
  <rect x="44" y="176" width="296" height="20" rx="4" fill="#4f46e5"/>
  <text x="350" y="191" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#334155">28.2 GB</text>

  <text x="44" y="222" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#334155">Phase 6 Series X (1080p + In-Place)</text>
  <rect x="44" y="230" width="281" height="20" rx="4" fill="#7c3aed"/>
  <text x="335" y="245" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#5b21b6">26.8 GB</text>

  <text x="44" y="276" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Phase 6 Series S (Native + In-Place)</text>
  <rect x="44" y="284" width="259" height="20" rx="4" fill="#059669"/>
  <text x="313" y="299" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">24.7 GB (-11.5 GB)</text>

  <rect x="566" y="24" width="510" height="292" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="586" y="54" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">CPU Thread Time: MinGW GNU vs Native MSVC</text>
  <text x="586" y="74" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" fill="#475569">Eliminating TLS &amp; sync emulation across 140s capture runs</text>

  <text x="586" y="114" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#334155">Command List Translation (vesper-list)</text>
  <rect x="586" y="122" width="330" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="586" y="135" width="128" height="10" rx="3" fill="#7c3aed"/>
