<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-label="Vesper RAM and CPU Overhead Reduction Charts">
  <rect width="1100" height="340" rx="16" fill="#0b0f1a" stroke="#262b44" stroke-width="1.5"/>

  <!-- Left Panel: Peak Private RAM -->
  <rect x="24" y="24" width="510" height="292" rx="12" fill="#111729" stroke="#1e2742"/>
  <text x="44" y="54" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Peak Private RAM Footprint (-32%)</text>
  <text x="44" y="74" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">Windows Commit Charge · Fits comfortably inside 32 GB host RAM</text>

  <text x="44" y="114" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">Stock Baseline (4K)</text>
  <rect x="44" y="122" width="380" height="20" rx="4" fill="#ef4444" opacity="0.8"/>
  <text x="434" y="137" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#fca5a5">36.2 GB (paged)</text>

  <text x="44" y="168" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">Phase 4 Tuned (1440p FSR)</text>
  <rect x="44" y="176" width="296" height="20" rx="4" fill="#6366f1"/>
  <text x="350" y="191" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">28.2 GB</text>

  <text x="44" y="222" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">Phase 6 Series X (1080p + In-Place)</text>
  <rect x="44" y="230" width="281" height="20" rx="4" fill="#8b5cf6"/>
  <text x="335" y="245" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#e9d5ff">26.8 GB</text>

  <text x="44" y="276" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">Phase 6 Series S (Native + In-Place)</text>
  <rect x="44" y="284" width="259" height="20" rx="4" fill="#10b981"/>
  <text x="313" y="299" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7">24.7 GB (-11.5 GB)</text>

  <!-- Right Panel: MSVC vs GNU CPU -->
  <rect x="566" y="24" width="510" height="292" rx="12" fill="#111729" stroke="#1e2742"/>
  <text x="586" y="54" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">CPU Thread Time: MinGW GNU vs Native MSVC</text>
  <text x="586" y="74" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">Eliminating TLS &amp; sync emulation across 140s capture runs</text>

  <text x="586" y="114" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">Command List Translation (vesper-list)</text>
  <rect x="586" y="122" width="330" height="10" rx="3" fill="#475569"/>
  <rect x="586" y="135" width="128" height="10" rx="3" fill="#8b5cf6"/>
  <text x="926" y="136" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">28.95s -> 11.22s (-61%)</text>

  <text x="586" y="170" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">Queue Submit Thread (vesper-submit)</text>
  <rect x="586" y="178" width="240" height="10" rx="3" fill="#475569"/>
  <rect x="586" y="191" width="125" height="10" rx="3" fill="#a855f7"/>
  <text x="838" y="192" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff">3.56s -> 1.86s (-48%)</text>

  <text x="586" y="226" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">Upload Staging Workers (vesper-land)</text>
  <rect x="586" y="234" width="225" height="10" rx="3" fill="#475569"/>
  <rect x="586" y="247" width="107" height="10" rx="3" fill="#fb923c"/>
  <text x="822" y="248" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fdba74">3.33s -> 1.58s (-53%)</text>

  <text x="586" y="282" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">Descriptor Views Lookup (vesper-views)</text>
  <rect x="586" y="290" width="175" height="10" rx="3" fill="#475569"/>
  <rect x="586" y="303" width="43" height="10" rx="3" fill="#10b981"/>
  <text x="772" y="304" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">0.70s -> 0.17s (-76%)</text>
</svg>
