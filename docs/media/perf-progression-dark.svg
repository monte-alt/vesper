<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="1100" height="390" role="img" aria-label="Vesper Performance Progression Chart">
  <rect width="1100" height="390" rx="16" fill="#0b0f1a" stroke="#262b44" stroke-width="1.5"/>
  <text x="34" y="38" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Frame Rate &amp; Tail Latency Progression</text>
  <text x="34" y="60" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8">AMD Radeon RX 9070 XT (16 GB) · Ryzen 7 5800X3D · 32 GB RAM · Solid bar = Avg FPS, Amber cap = Peak FPS</text>

  <!-- Gridlines: x=330 (0 FPS) to x=840 (30 FPS), 17 px per FPS -->
  <g stroke="#1e253b" stroke-width="1">
    <line x1="330" y1="84" x2="330" y2="338"/>
    <line x1="500" y1="84" x2="500" y2="338"/>
    <line x1="670" y1="84" x2="670" y2="338"/>
  </g>
  <line x1="840" y1="80" x2="840" y2="342" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="840" y="76" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">30 FPS Target (33.3 ms)</text>
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="330" y="356">0 FPS</text>
    <text x="500" y="356">10 FPS</text>
    <text x="670" y="356">20 FPS</text>
    <text x="840" y="356">30 FPS</text>
  </g>

  <!-- Row 1: Stock Baseline 4.44 avg / 11.5 max -->
  <text x="318" y="106" text-anchor="end" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Stock Baseline (4K diag)</text>
  <rect x="330" y="90" width="195.5" height="22" rx="4" fill="#334155"/>
  <rect x="330" y="90" width="75.5" height="22" rx="4" fill="#64748b"/>
  <text x="860" y="106" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#94a3b8">4.44 avg / 11.5 max · 1,456 ms p95</text>

  <!-- Row 2: Phase 4 Tuned 9.62 avg / 15.3 max -->
  <text x="318" y="148" text-anchor="end" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Phase 4 Tuned (1440p FSR)</text>
  <rect x="330" y="132" width="260.1" height="22" rx="4" fill="#7c2d12"/>
  <rect x="330" y="132" width="163.5" height="22" rx="4" fill="#6366f1"/>
  <text x="860" y="148" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">9.62 avg / 15.3 max · 201 ms p95</text>

  <!-- Row 3: Phase 5 GNU + Agility 11.76 avg / 18.7 max -->
  <text x="318" y="190" text-anchor="end" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Phase 5 Agility 1.614 (1440p)</text>
  <rect x="330" y="174" width="317.9" height="22" rx="4" fill="#9a3412"/>
  <rect x="330" y="174" width="199.9" height="22" rx="4" fill="#7c3aed"/>
  <text x="860" y="190" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">11.76 avg / 18.7 max · 192 ms p95</text>

  <!-- Row 4: Phase 6 MSVC + Barriers + In-Place 1080p 14.85 avg / 22.8 max -->
  <text x="318" y="232" text-anchor="end" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Phase 6 MSVC + In-Place (1080p)</text>
  <rect x="330" y="216" width="387.6" height="22" rx="4" fill="#ea580c"/>
  <rect x="330" y="216" width="252.5" height="22" rx="4" fill="#8b5cf6"/>
  <text x="860" y="232" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">14.85 avg / 22.8 max · 175 ms p95</text>

  <!-- Row 5: Phase 6 MSVC + Barriers + In-Place Series S 18.72 avg / 22.9 max -->
  <text x="318" y="274" text-anchor="end" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Phase 6 MSVC + In-Place (Series S)</text>
  <rect x="330" y="258" width="389.3" height="22" rx="4" fill="#f59e0b"/>
  <rect x="330" y="258" width="318.2" height="22" rx="4" fill="#a855f7"/>
  <text x="860" y="274" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fde68a">18.72 avg / 22.9 max · 78.6 ms p95</text>

  <!-- Row 6: 720p Ceiling Probe 13.54 avg / 26.8 max -->
  <text x="318" y="316" text-anchor="end" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">720p Fixed-GPU Ceiling Probe</text>
  <rect x="330" y="300" width="455.6" height="22" rx="4" fill="#fb923c"/>
  <rect x="330" y="300" width="230.2" height="22" rx="4" fill="#6366f1"/>
  <text x="860" y="316" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">13.54 avg / 26.8 max · 23-24 settled</text>
</svg>
