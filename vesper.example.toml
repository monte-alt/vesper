# Copy to `vesper.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VESPER_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: VESPER_GAME_DIR
game_dir = 'D:\vesper-data\game'

# PC FSR 4.1.2 upscaler for -Fsr4K.   env: VESPER_FIDELITYFX_DIR
# fidelityfx_dir = 'D:\vesper-data\fidelityfx-4.1.2'

# Derived data. Default: %LOCALAPPDATA%\vesper\cache.   env: VESPER_CACHE_DIR
# cache_dir = 'D:\vesper-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\vesper\data.   env: VESPER_DATA_DIR
# data_dir = 'D:\vesper-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: VESPER_TEST_TITLES (separated by ';')
test_titles = []
